site_name: My site
site_url: https://cegthb.github.io/MkDocs-MaterialDemo/
theme:
  name: material
  language: ro
  features:
    - navigation.tabs
    #- navigation.tabs.sticky
  font:
    text: Merriweather Sans
    code: Red Hat Mono
  icon:
    logo: simple/sagemath
  favicon: assets/sagemath.svg
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: green
      accent: deep orange
    
    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: blue
      accent: deep orange

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.critic
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables      

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js    

nav:
  - Acasă: index.md
  - Despre: despre.md
  - Test: 
    - code-examples.md
  - Algebra:
    - algebra/alg-page1.md
    - algebra/alg-page2.md
  - Geometrie:
    - geometrie/geo-page1.md
    - geometrie/geo-page2.md